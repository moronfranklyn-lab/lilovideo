<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lilovideo 图标 · 小尺寸专用（16 / 24 px）

  与主图标的差异（这是刻意的光学补偿，不是缩放）：
  1. 去掉右上创意点。16px 下它只有约 1px，会变成噪点。
  2. 画框描边加粗到 4.6（主图标 3.6）。缩放后细线会被抗锯齿抹淡。
  3. 播放符占比加大到画幅内宽约 56%。小尺寸下实心块比线条更能保留形状。
  4. 圆角略收（rx 6.5），避免小尺寸下圆角吃掉太多边长。

  判断标准：16px 下必须仍是「一个框 + 一个实心三角」两个可辨色块。

  为什么不用渐变：小尺寸下渐变根本看不出来，却引入一个真实风险——
  SVG 以 <img> 或内联方式同页出现多个时，url(#id) 的 id 可能跨文档串扰，
  导致引用失效、整张图不渲染。这里改用纯色，少一个装饰就少一个失败点。
  主图标保留渐变（大尺寸下可见），但同样不依赖它与小尺寸变体共存。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Lilovideo">
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1B1B23"/>

  <!-- 画框：比主图标更粗、更大，撑满可用空间 -->
  <rect x="10.5" y="13.5" width="43" height="37" rx="6.5"
        fill="none" stroke="#FF8A55" stroke-width="4.6"/>

  <!-- 播放符：放大到画幅内宽的约 56% -->
  <path d="M25.5 21.5 L41.5 32 L25.5 42.5 Z"
        fill="#FF7A45" stroke="#FF7A45" stroke-width="3.2" stroke-linejoin="round"/>
</svg>
