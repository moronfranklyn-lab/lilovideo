<?xml version="1.0" encoding="UTF-8"?>
<!--
  概念 4 · 断轴（阈值）
  谱系：构成主义（Constructivist）
  种子：静止与运动之间隔着一道倾斜的断口。

  构造：一个粗重的圆角方块，被一条 45° 斜缝从中间切断。
  两半发生轻微错位，所以它读起来不是「被切开」而是「正在错开」——
  这正是阈值那一瞬的状态。错位由一块主色块斜压形成视觉上的连续。

  这是本轮三个「按简报」概念里最激进的：它放弃了对称与稳定，
  用不稳定表达产品做的事（把静止变成运动）。

  技法说明：
  - 两半各为一条实心 path，斜缝是真正的物理间隙，不是背景色遮盖。
  - 错位量刻意取 5 单位；按规范，微小错位像失误，明显错位才是意图。
  - 单一颜色，无渐变，无底板。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lilovideo">
  <g id="mark" fill="#FF7A45">
    <!-- 左上块 -->
    <path id="upper-left"
          d="M20 14 H62 L44 46 H20 a6 6 0 0 1 -6 -6 V20 a6 6 0 0 1 6 -6 Z"/>
    <!-- 右下块：整体向右下错开 5 单位 -->
    <path id="lower-right"
          d="M80 86 H38 L56 54 H80 a6 6 0 0 1 6 6 V80 a6 6 0 0 1 -6 6 Z"/>
  </g>
</svg>
