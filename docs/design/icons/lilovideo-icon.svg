<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lilovideo 主图标 · 定稿

  设计说明
  ========
  结构：分镜画幅（圆角方框）+ 播放符 + 右上创意点。
  语义：一格格分镜最终连成成片；右上点代表「一句话进来的创意」。

  关键设计决策
  ============
  1. 画幅内缩：外框到画布边缘保留 12/64 = 18.75% 的留白。图标在小尺寸下
     被系统裁切或加圆角遮罩时，边缘元素不会被切掉。
  2. 播放符放大且贴住光心：三角占画幅内宽的约 46%，视觉重心居中偏右，
     避免小尺寸下与外框糊成一团。
  3. 创意点与画幅右上角相切但不重叠：既是「点子落到分镜上」的暗示，
     也避免小尺寸下与边框连成一块。
  4. 不做多余装饰：无描边叠加、无阴影、无渐变叠层，保证 16px 下仍是两个
     清晰色块（框 + 三角）。

  配色：强调色渐变 #FF9A6B 到 #E8642F，取自设计规范中强调色 token(#FF7A45) 的邻域，
  目的是在深色表面上略提亮，补偿暗底对暖色的吸收。

  注意：注释内不得出现连续两个连字符。那是 XML 注释的结束标记，一旦出现
  整个 SVG 会被解析器拒绝、完全不渲染（本项目已踩过这个坑，包括写在注释里的
  CSS 变量名也要避免带连字符前缀）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Lilovideo">
  <defs>
    <linearGradient id="lv-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A6B"/>
      <stop offset="100%" stop-color="#E8642F"/>
    </linearGradient>
  </defs>

  <!-- 底：与界面卡片同色，使图标在任意背景上保持一致辨识度 -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1B1B23"/>

  <!-- 分镜画幅 -->
  <rect x="12.5" y="14.5" width="39" height="35" rx="7.5"
        fill="none" stroke="url(#lv-grad)" stroke-width="3.6"/>

  <!-- 播放符：贴住画幅光心，保证小尺寸下仍是实心色块 -->
  <path d="M27.6 23.2 L40.6 32 L27.6 40.8 Z"
        fill="#FF7A45" stroke="#FF7A45" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 创意点：与画幅右上角相切 -->
  <circle cx="48.5" cy="14.5" r="4" fill="#FF7A45"/>
</svg>
