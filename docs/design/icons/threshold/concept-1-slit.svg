<?xml version="1.0" encoding="UTF-8"?>
<!--
  概念 1 · 门缝（阈值）
  谱系：日本纹章（Kamon）
  种子：一帧是一个完整的世界，让静止变成影片的是其中一道开口。

  构造：一个实心圆角方块，内部用 evenodd 挖出一道倾斜的窄缝。
  缝越过了方块的边缘，所以它是一道「关不严的缝」，不是一个封闭的窗口。
  读法：既是画幅的边界，也是静止到运动之间的那道缝。

  技法说明（按设计规范）：
  - 整个形状是**一条 path**，洞由 fill-rule="evenodd" 真正挖出，
    不是叠一个背景色形状。这样单色渲染、反色、丝网印都不会塌。
  - 无背景底板。留白由画布本身提供。
  - 单一元素、单一颜色、单一焦点。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lilovideo">
  <g id="mark">
    <path id="block-with-slit" fill="#FF7A45" fill-rule="evenodd"
          d="M22 14 H78 a8 8 0 0 1 8 8 V78 a8 8 0 0 1 -8 8 H22 a8 8 0 0 1 -8 -8 V22 a8 8 0 0 1 8 -8 Z
             M47 20 L57 20 L47 80 L37 80 Z"/>
  </g>
</svg>
