<?xml version="1.0" encoding="UTF-8"?>
<!--
  概念 1b · 斜缝（两色 + 刻意失衡）
  谱系：日本纹章（Kamon）

  种子的进一步落实
  ================
  「一帧是一个完整的世界，让静止变成影片的是其中一道开口。」
  前一版把缝画成居中直线，结果只是一个没有立场的斜杠。
  这一版做三件具体的事：

  1. 缝是有方向的：它偏斜，且上宽下窄 —— 像一道正在被推开的门，
     而不是一道静止的刻痕。开口处给出方向。
  2. 缝里露出第二层色：缝的右侧是一条较亮的窄面色，读作「门后透进来的光」，
     它同时是整张图的焦点，解决了「全图一个色没有重心」的问题。
  3. 打破对称：缝的位置不在正中，质量偏向左侧，右侧留出更大的空。
     按设计规范，完美对称是惰性的；一处刻意失衡才让形站住。

  技法：单条 path + evenodd 挖洞，无背景底板，单色下仍是完整实体。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lilovideo">
  <g id="mark">
    <!-- 主体：实心圆角方块，斜缝为真实的洞 -->
    <path id="frame" fill="#FF7A45" fill-rule="evenodd"
          d="M20 16 H76 a8 8 0 0 1 8 8 V76 a8 8 0 0 1 -8 8 H20 a8 8 0 0 1 -8 -8 V24 a8 8 0 0 1 8 -8 Z
             M44 16 L57 16 L44 84 L31 84 Z"/>
    <!-- 门后透进来的光：缝右侧的窄面色，全图唯一焦点 -->
    <path id="light" fill="#FFD9C2"
          d="M44 16 L50 16 L37 84 L31 84 Z"/>
  </g>
</svg>
