<?xml version="1.0" encoding="UTF-8"?>
<!--
  概念 5 · 步进（阈值）
  谱系：欧普 / 系统性重复（Op / Systematic Repetition）
  种子：一扇门不是一次打开，而是六格逐格亮起。

  构造：六个竖向条格，从空到满依次推进，最后一格完全实心。
  其余格各自带一小段实心，长度递增——用重复与增量表达六个阶段。
  读法：这是把「流水线」本身当成阈值的读法：静止的输入在一格格推进中
  变成运动的输出。

  这是本轮的「反气质」概念：前四个都是安静、单一、克制的；
  这一个用密度与节奏说话，气质更接近仪器仪表盘。

  技法说明：
  - 六个格子等宽等距，是同一个模式的六次出现，符合欧普谱系的定义。
  - 最细处为主条格宽 6 单位，16px 下仍能保留格与格的区别（规范要求空隙
    不小于 4 单位，此处空隙为 6）。
  - 单一颜色，无底板，全部为实心 path。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lilovideo">
  <g id="mark" fill="#FF7A45">
    <!-- 六格：x 从 14 起，每格宽 8、间隔 4；实心高度递增 -->
    <rect id="bar-1" x="14" y="70" width="8" height="16" rx="4"/>
    <rect id="bar-2" x="27" y="62" width="8" height="24" rx="4"/>
    <rect id="bar-3" x="40" y="52" width="8" height="34" rx="4"/>
    <rect id="bar-4" x="53" y="40" width="8" height="46" rx="4"/>
    <rect id="bar-5" x="66" y="26" width="8" height="60" rx="4"/>
    <rect id="bar-6" x="79" y="14" width="8" height="72" rx="4"/>
  </g>
</svg>
